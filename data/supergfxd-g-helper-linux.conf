# G-Helper Linux: supergfxd-Modus vor dem Start an die Hardware angleichen
# (verhindert, dass supergfxd die dGPU in Eco wieder einschaltet oder beim Booten
# an "rmmod nvidia" hängen bleibt). Ein Fehler hier blockiert supergfxd nicht ("-").
[Service]
ExecStartPre=-/usr/libexec/g-helper-linux/ghelper-supergfx-sync
